<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Musical Wave / Glow Background -->
  <circle cx="200" cy="130" r="70" fill="url(#primaryGrad)" opacity="0.15"/>
  
  <!-- Icon: Musical Note / Instrument Symbol -->
  <g transform="translate(160, 80)" fill="none" stroke="url(#primaryGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="80" r="16" fill="url(#primaryGrad)"/>
    <circle cx="65" cy="65" r="16" fill="url(#primaryGrad)"/>
    <path d="M36 80V25 L81 10V65" />
    <path d="M36 40 L81 25" stroke-width="4"/>
  </g>
  
  <!-- SoloTono Text -->
  <text x="200" y="225" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="2">
    SOLOTONO
  </text>
  <text x="200" y="248" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">
    Instrumento Musical
  </text>
</svg>
